<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUFFGO 数据后台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"SF Mono","Consolas","Microsoft YaHei",monospace;background:#0c0a06;color:#d8cbb0;min-height:100vh;padding:20px;}
  h1{font-size:22px;color:#e4ae39;margin-bottom:20px;letter-spacing:2px;}
  h2{font-size:16px;color:#d98a3a;margin:24px 0 12px;letter-spacing:1px;border-left:3px solid #d98a3a;padding-left:10px;}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
  .card{background:linear-gradient(135deg,#1a1712,#221d16);border:1px solid #3a3228;border-radius:8px;padding:16px;}
  .card .label{font-size:11px;color:#8a7d63;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
  .card .value{font-size:28px;font-weight:900;color:#e4ae39;}
  .card .sub{font-size:11px;color:#6b6153;margin-top:4px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{background:#221d16;color:#d98a3a;padding:10px 8px;text-align:left;font-weight:700;border-bottom:2px solid #3a3228;white-space:nowrap;}
  td{padding:8px;border-bottom:1px solid #2a2520;white-space:nowrap;}
  tr:hover td{background:#1a1712;}
  .wrap{max-width:1100px;margin:0 auto;}
  .refresh{background:linear-gradient(180deg,#e0a24a,#c07c1e);border:1px solid #e0b96a;border-radius:6px;color:#241a08;font-weight:900;font-size:13px;padding:8px 18px;cursor:pointer;letter-spacing:1px;float:right;}
  .refresh:active{transform:translateY(1px);}
  .empty{color:#6b6153;text-align:center;padding:20px;}
  .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;}
  .b-green{background:#1a3320;color:#4ade80;}
  .b-orange{background:#33281a;color:#fbbf24;}
  .duration{color:#8a7d63;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 BUFFGO 数据后台 <button class="refresh" onclick="loadStats()">刷新</button></h1>

  <h2>累计数据</h2>
  <div class="summary" id="summary"></div>

  <h2>每日数据（最近30天）</h2>
  <table id="dailyTable"></table>

  <h2>最近20局明细</h2>
  <table id="recentTable"></table>
</div>

<script>
function fmtDuration(sec){
  if(!sec||sec<1)return '—';
  if(sec<60)return sec+'秒';
  const m=Math.floor(sec/60),s=sec%60;
  return m+'分'+(s>0?s+'秒':'');
}
function fmtTime(ts){
  if(!ts)return '—';
  const d=new Date(ts);
  return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

async function loadStats(){
  try{
    const r=await fetch('/api/stats');
    const data=await r.json();
    renderSummary(data.total);
    renderDaily(data.daily);
    renderRecent(data.recent);
  }catch(e){
    document.getElementById('summary').innerHTML='<div class="empty">⚠ 加载失败：'+e.message+'</div>';
  }
}

function renderSummary(t){
  const html=`
    <div class="card"><div class="label">总游玩次数</div><div class="value">${t.plays}</div><div class="sub">局数</div></div>
    <div class="card"><div class="label">游玩人数</div><div class="value">${t.players}</div><div class="sub">独立昵称</div></div>
    <div class="card"><div class="label">平均波数</div><div class="value">${t.avg_wave}</div><div class="sub">每局到达</div></div>
    <div class="card"><div class="label">平均时长</div><div class="value">${fmtDuration(t.avg_duration)}</div><div class="sub">每局</div></div>
    <div class="card"><div class="label">最高波数</div><div class="value">${t.max_wave}</div><div class="sub">历史最高</div></div>
    <div class="card"><div class="label">总击杀数</div><div class="value">${(t.total_kills||0).toLocaleString()}</div><div class="sub">累计</div></div>
  `;
  document.getElementById('summary').innerHTML=html;
}

function renderDaily(rows){
  if(!rows||!rows.length){
    document.getElementById('dailyTable').innerHTML='<tbody><tr><td class="empty">暂无数据</td></tr></tbody>';
    return;
  }
  let html='<thead><tr><th>日期</th><th>游玩次数</th><th>游玩人数</th><th>平均波数</th><th>平均时长</th><th>最高波数</th><th>总击杀</th></tr></thead><tbody>';
  rows.forEach(r=>{
    html+=`<tr><td><strong>${r.day}</strong></td><td>${r.plays}</td><td>${r.players}</td><td>${r.avg_wave}</td><td class="duration">${fmtDuration(r.avg_duration)}</td><td>${r.max_wave}</td><td>${r.kills}</td></tr>`;
  });
  html+='</tbody>';
  document.getElementById('dailyTable').innerHTML=html;
}

function renderRecent(rows){
  if(!rows||!rows.length){
    document.getElementById('recentTable').innerHTML='<tbody><tr><td class="empty">暂无数据</td></tr></tbody>';
    return;
  }
  let html='<thead><tr><th>昵称</th><th>波数</th><th>击杀</th><th>合成</th><th>最高等级</th><th>时长</th><th>开始时间</th></tr></thead><tbody>';
  rows.forEach(r=>{
    const cls=r.wave>=15?'b-green':r.wave>=8?'b-orange':'';
    html+=`<tr><td>${r.nick}</td><td><span class="badge ${cls}">${r.wave}</span></td><td>${r.kills}</td><td>${r.combos}</td><td>Lv.${r.maxLv}</td><td class="duration">${fmtDuration(r.duration)}</td><td class="duration">${fmtTime(r.startedAt)}</td></tr>`;
  });
  html+='</tbody>';
  document.getElementById('recentTable').innerHTML=html;
}

loadStats();
setInterval(loadStats,30000); // 30秒自动刷新
</script>
</body>
</html>
